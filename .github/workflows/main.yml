name: Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup PHP (For testing, optional)
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Copy .env.example to .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    # Optional: Run Tests before deploying
    # - name: Execute tests
    #   run: vendor/bin/phpunit

    # ... (rest of the file is the same)
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_DNS }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Navigate to the folder
          cd /var/www/pethaven

          # 1. FETCH the latest changes from GitHub
          git fetch origin main

          # 2. FORCE the server to match GitHub exactly 
          # (This fixes the missing file AND the 'M composer.lock' warnings you saw)
          git reset --hard origin/main

          # 3. NOW we can run the script, because it definitely exists
          bash deploy.sh